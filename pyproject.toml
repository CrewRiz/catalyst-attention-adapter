[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-attention-adapter"
version = "0.1.0"
description = "Source-available softmax-attention replacement powered by catalyst-brain quantum attention heads."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Strategic Innovations AI", email = "hello@strategic-innovations.ai" }]
dependencies = ["catalyst-brain>=1.3.3,<2"]
keywords = ["attention", "softmax", "quantum-attention", "context-engineering", "catalyst-brain"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/CrewRiz/catalyst-attention-adapter"
Commercial = "https://strategic-innovations.ai"

[project.scripts]
catalyst-attention-smoke = "catalyst_attention_adapter.cli:smoke_main"
catalyst-attention-benchmark = "catalyst_attention_adapter.cli:benchmark_main"

[tool.setuptools.packages.find]
where = ["src"]
